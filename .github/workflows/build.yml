          w('PrefsEntry.plist', {'entry':{'bundle':'MayHUDPrefs','cell':'PSLinkCell','detail':'MHPaneController','isController':True,'label':'MayHUD','icon':'icon.png'}})
          print('generated', len(os.listdir('bundle')), 'files')
