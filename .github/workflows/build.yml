name: Build MayHUD
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create tweak files
        run: |
          cat > Tweak.m <<'MAYEOF'
          // MayHUD — status-bar widgets (time, date, battery, custom text) drawn by a
          // click-through window inside SpringBoard. No private APIs, no extra process.
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #include <math.h>

          #define kDomain CFSTR("local.mayhud")

          @interface MHWindow : UIWindow
          @end
          @implementation MHWindow
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e { return nil; }
          - (BOOL)pointInside:(CGPoint)p withEvent:(UIEvent *)e { return NO; }
          @end

          static MHWindow *gWin;
          static UILabel *gLabels[3];                 // left, center, right
          static NSString *gTypes[3], *gCustom[3];
          static NSDateFormatter *gTimeF, *gTimeSecF, *gDateF;
          static NSTimer *gTimer;
          static int gTick = 0;

          #pragma mark - Preferences

          static NSString *prefString(NSString *key, NSString *def) {
              CFPropertyListRef v = CFPreferencesCopyAppValue((__bridge CFStringRef)key, kDomain);
              NSString *r = def;
              if (v) { if (CFGetTypeID(v) == CFStringGetTypeID()) r = [(__bridge NSString *)v copy]; CFRelease(v); }
              return r;
          }
          static BOOL prefBool(NSString *key, BOOL def) {
              CFPropertyListRef v = CFPreferencesCopyAppValue((__bridge CFStringRef)key, kDomain);
              BOOL r = def;
              if (v) {
                  if (CFGetTypeID(v) == CFBooleanGetTypeID()) r = CFBooleanGetValue(v);
                  else if (CFGetTypeID(v) == CFNumberGetTypeID()) { int n = 0; CFNumberGetValue(v, kCFNumberIntType, &n); r = n != 0; }
                  CFRelease(v);
              }
              return r;
          }
          static double prefDouble(NSString *key, double def) {
              CFPropertyListRef v = CFPreferencesCopyAppValue((__bridge CFStringRef)key, kDomain);
              double r = def;
              if (v) { if (CFGetTypeID(v) == CFNumberGetTypeID()) CFNumberGetValue(v, kCFNumberDoubleType, &r); CFRelease(v); }
              return r;
          }

          #pragma mark - Text

          static NSString *batteryString(void) {
              UIDevice *d = UIDevice.currentDevice;
              d.batteryMonitoringEnabled = YES;
              float l = d.batteryLevel;
              if (l < 0) return @"--%";
              NSString *s = [NSString stringWithFormat:@"%d%%", (int)lroundf(l * 100)];
              if (d.batteryState == UIDeviceBatteryStateCharging) s = [@"⚡ " stringByAppendingString:s];
              return s;
          }

          static NSString *textFor(NSString *type, NSString *custom) {
              NSDate *now = [NSDate date];
              if ([type isEqualToString:@"time"])    return [gTimeF stringFromDate:now];
              if ([type isEqualToString:@"timesec"]) return [gTimeSecF stringFromDate:now];
              if ([type isEqualToString:@"date"])    return [gDateF stringFromDate:now];
              if ([type isEqualToString:@"battery"]) return batteryString();
              if ([type isEqualToString:@"custom"]) {
                  NSString *t = custom ?: @"";
                  t = [t stringByReplacingOccurrencesOfString:@"{time}" withString:[gTimeF stringFromDate:now]];
                  t = [t stringByReplacingOccurrencesOfString:@"{date}" withString:[gDateF stringFromDate:now]];
                  t = [t stringByReplacingOccurrencesOfString:@"{battery}" withString:batteryString()];
                  return t;
              }
              return @"";
          }

          static void tick(void) {
              if (!gWin || gWin.hidden) return;
              for (int i = 0; i < 3; i++) gLabels[i].text = textFor(gTypes[i], gCustom[i]);
          }

          static UIColor *colorNamed(NSString *n) {
              if ([n isEqualToString:@"black"])  return UIColor.blackColor;
              if ([n isEqualToString:@"red"])    return UIColor.systemRedColor;
              if ([n isEqualToString:@"green"])  return UIColor.systemGreenColor;
              if ([n isEqualToString:@"blue"])   return UIColor.systemBlueColor;
              if ([n isEqualToString:@"yellow"]) return UIColor.systemYellowColor;
              return UIColor.whiteColor;
          }

          static void applyPrefs(void) {
              if (!gWin) return;
              CFPreferencesAppSynchronize(kDomain);
              gWin.hidden = !prefBool(@"enabled", YES);

              NSLocale *loc = NSLocale.currentLocale;
              gTimeF    = [NSDateFormatter new]; gTimeF.dateFormat    = [NSDateFormatter dateFormatFromTemplate:@"jm"  options:0 locale:loc];
              gTimeSecF = [NSDateFormatter new]; gTimeSecF.dateFormat = [NSDateFormatter dateFormatFromTemplate:@"jms" options:0 locale:loc];
              gDateF    = [NSDateFormatter new]; gDateF.dateFormat    = [NSDateFormatter dateFormatFromTemplate:@"EEEdMMM" options:0 locale:loc];

              gTypes[0] = prefString(@"leftType",   @"date");
              gTypes[1] = prefString(@"centerType", @"time");
              gTypes[2] = prefString(@"rightType",  @"battery");
              gCustom[0] = prefString(@"leftText",   @"");
              gCustom[1] = prefString(@"centerText", @"");
              gCustom[2] = prefString(@"rightText",  @"");

              CGFloat size = (CGFloat)prefDouble(@"fontSize", 13.0);
              UIFont *font = prefBool(@"bold", YES) ? [UIFont boldSystemFontOfSize:size] : [UIFont systemFontOfSize:size];
              UIColor *color = colorNamed(prefString(@"color", @"white"));
              CGFloat alpha = (CGFloat)prefDouble(@"opacity", 1.0);
              CGFloat y = (CGFloat)prefDouble(@"yOffset", 50.0);
              CGFloat inset = (CGFloat)prefDouble(@"sideInset", 24.0);
              CGFloat W = UIScreen.mainScreen.bounds.size.width, third = (W - 2 * inset) / 3.0;
              NSTextAlignment al[3] = { NSTextAlignmentLeft, NSTextAlignmentCenter, NSTextAlignmentRight };
              for (int i = 0; i < 3; i++) {
                  gLabels[i].font = font;
                  gLabels[i].textColor = color;
                  gLabels[i].alpha = alpha;
                  gLabels[i].textAlignment = al[i];
                  gLabels[i].frame = CGRectMake(inset + i * third, y, third, size + 10);
                  gLabels[i].layer.shadowColor = UIColor.blackColor.CGColor;
                  gLabels[i].layer.shadowOpacity = [color isEqual:UIColor.blackColor] ? 0 : 0.6;
                  gLabels[i].layer.shadowRadius = 2;
                  gLabels[i].layer.shadowOffset = CGSizeZero;
              }
              tick();
          }

          static void onReload(CFNotificationCenterRef c, void *o, CFNotificationName n, const void *obj, CFDictionaryRef u) {
              dispatch_async(dispatch_get_main_queue(), ^{ applyPrefs(); });
          }

          #pragma mark - Setup

          static void setup(void) {
              UIWindowScene *scene = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:UIWindowScene.class]) { scene = (UIWindowScene *)s; break; }
              }
              gWin = scene ? [[MHWindow alloc] initWithWindowScene:scene]
                           : [[MHWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gWin.frame = UIScreen.mainScreen.bounds;
              gWin.windowLevel = 100000;
              gWin.backgroundColor = UIColor.clearColor;
              gWin.userInteractionEnabled = NO;
              UIViewController *vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.clearColor;
              vc.view.userInteractionEnabled = NO;
              gWin.rootViewController = vc;
              for (int i = 0; i < 3; i++) {
                  gLabels[i] = [UILabel new];
                  gLabels[i].userInteractionEnabled = NO;
                  gLabels[i].adjustsFontSizeToFitWidth = YES;
                  gLabels[i].minimumScaleFactor = 0.6;
                  [vc.view addSubview:gLabels[i]];
              }
              gWin.hidden = NO;
              applyPrefs();

              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onReload,
                  CFSTR("local.mayhud.reload"), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);

              gTimer = [NSTimer timerWithTimeInterval:1.0 repeats:YES block:^(NSTimer *t) {
                  if (++gTick % 10 == 0) applyPrefs(); else tick();
              }];
              [NSRunLoop.mainRunLoop addTimer:gTimer forMode:NSRunLoopCommonModes];
              NSLog(@"[MayHUD] window created (scene: %@)", scene ? @"yes" : @"no");
          }

          __attribute__((constructor))
          static void mayhud_init(void) {
              if (![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.springboard"]) return;
              NSLog(@"[MayHUD] loaded in SpringBoard");
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 6 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ setup(); });
          }
          MAYEOF
          cat > MayHUD.plist <<'MAYEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>Filter</key><dict><key>Bundles</key><array><string>com.apple.springboard</string></array></dict></dict></plist>
          MAYEOF
          cat > control <<'MAYEOF'
          Package: local.mayhud
          Name: MayHUD
          Version: 0.1.0
          Architecture: iphoneos-arm64e
          Description: Status-bar widgets (time, date, battery, custom text) drawn inside SpringBoard. Settings pane in the Settings app.
          Maintainer: Local Build
          Author: Local Build
          Section: Tweaks
          Depends: ellekit | mobilesubstrate
          MAYEOF
          cat > PrefsController.m <<'MAYEOF'
          // MayHUD settings pane with an English / Russian switch (English by default).
          #import <UIKit/UIKit.h>

          @interface PSSpecifier : NSObject
          @end

          @interface PSListController : UIViewController
          - (NSArray *)loadSpecifiersFromPlistName:(NSString *)name target:(id)target;
          - (void)reloadSpecifiers;
          - (void)setPreferenceValue:(id)value specifier:(PSSpecifier *)specifier;
          @end

          #define kDomain CFSTR("local.mayhud")

          static NSString *currentLang(void) {
              CFPreferencesAppSynchronize(kDomain);
              CFPropertyListRef v = CFPreferencesCopyAppValue(CFSTR("language"), kDomain);
              NSString *r = @"en";
              if (v) {
                  if (CFGetTypeID(v) == CFStringGetTypeID() && [(__bridge NSString *)v isEqualToString:@"ru"]) r = @"ru";
                  CFRelease(v);
              }
              return r;
          }

          @interface MHRootListController : PSListController
          @property (nonatomic, copy) NSString *loadedLang;
          @end

          @implementation MHRootListController

          - (NSArray *)specifiers {
              NSArray *s = nil;
              @try { s = [self valueForKey:@"_specifiers"]; } @catch (__unused id e) {}
              if (!s) {
                  NSString *lang = currentLang();
                  NSString *plist = [lang isEqualToString:@"ru"] ? @"RootRU" : @"RootEN";
                  s = [self loadSpecifiersFromPlistName:plist target:self];
                  @try { [self setValue:s forKey:@"_specifiers"]; } @catch (__unused id e) {}
                  self.loadedLang = lang;
              }
              return s;
          }

          - (void)refreshIfLangChanged {
              if (self.loadedLang && ![self.loadedLang isEqualToString:currentLang()]) {
                  @try { [self setValue:nil forKey:@"_specifiers"]; } @catch (__unused id e) {}
                  [self reloadSpecifiers];
              }
          }

          - (void)setPreferenceValue:(id)value specifier:(PSSpecifier *)specifier {
              [super setPreferenceValue:value specifier:specifier];
              [self refreshIfLangChanged];
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              [self refreshIfLangChanged];
          }

          @end
          MAYEOF
