name: Build MayHUD
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Create tweak files
        run: |
          cat > Tweak.m <<'MAYEOF'
          // MayHUD 0.2 - Helium-style widget sets drawn inside SpringBoard.
          // 3 widget sets x 4 widgets: date, time, text, network speed, device temperature,
          // battery details, battery capacity, charging symbol, weather (QWeather).
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #include <ifaddrs.h>
          #include <net/if.h>
          #include <sys/socket.h>
          #include <dlfcn.h>
          #include <mach/mach.h>
          #include <math.h>

          #define kDomain CFSTR("local.mayhud")
          #define NSETS 3
          #define NSLOTS 4

          @interface MHWindow : UIWindow
          @end
          @implementation MHWindow
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e { return nil; }
          - (BOOL)pointInside:(CGPoint)p withEvent:(UIEvent *)e { return NO; }
          @end

          static MHWindow *gWin;
          static UIView *gCont[NSETS];
          static UIVisualEffectView *gBlur[NSETS];
          static UILabel *gLab[NSETS];
          static NSTimeInterval gLast[NSETS];
          static NSDictionary *gP;
          static NSTimer *gTimer;
          static int gTick = 0;
          static NSMutableDictionary<NSString *, NSDateFormatter *> *gFmt;

          #pragma mark - Preferences

          static NSString *ps(NSString *k, NSString *d) { id v = gP[k]; return [v isKindOfClass:NSString.class] ? v : d; }
          static BOOL pb(NSString *k, BOOL d) { id v = gP[k]; return [v isKindOfClass:NSNumber.class] ? [v boolValue] : d; }
          static double pd(NSString *k, double d) { id v = gP[k]; return [v isKindOfClass:NSNumber.class] ? [v doubleValue] : d; }
          static NSString *SK(int i, NSString *n) { return [NSString stringWithFormat:@"s%d_%@", i, n]; }
          static NSString *WK(int i, int j, NSString *n) { return [NSString stringWithFormat:@"s%dw%d_%@", i, j, n]; }

          static void loadPrefs(void) {
              CFPreferencesAppSynchronize(kDomain);
              NSMutableDictionary *m = [NSMutableDictionary dictionary];
              CFArrayRef keys = CFPreferencesCopyKeyList(kDomain, kCFPreferencesCurrentUser, kCFPreferencesAnyHost);
              if (keys) {
                  CFDictionaryRef d = CFPreferencesCopyMultiple(keys, kDomain, kCFPreferencesCurrentUser, kCFPreferencesAnyHost);
                  if (d) [m addEntriesFromDictionary:(__bridge_transfer NSDictionary *)d];
                  CFRelease(keys);
              }
              NSDictionary *file = [NSDictionary dictionaryWithContentsOfFile:@"/var/mobile/Library/Preferences/local.mayhud.plist"];
              if ([file isKindOfClass:NSDictionary.class])
                  for (id k in file) if (!m[k]) m[k] = file[k];
              gP = m;
          }

          #pragma mark - IOKit battery info (loaded dynamically)

          typedef CFMutableDictionaryRef (*MHMatchFn)(const char *);
          typedef mach_port_t (*MHGetFn)(mach_port_t, CFDictionaryRef);
          typedef kern_return_t (*MHPropsFn)(mach_port_t, CFMutableDictionaryRef *, CFAllocatorRef, uint32_t);
          typedef kern_return_t (*MHRelFn)(mach_port_t);

          static NSDictionary *batteryInfo(void) {
              static NSDictionary *cache;
              static NSTimeInterval last;
              static void *h;
              static MHMatchFn fMatch; static MHGetFn fGet; static MHPropsFn fProps; static MHRelFn fRel;
              NSTimeInterval now = CACurrentMediaTime();
              if (cache && now - last < 2.0) return cache;
              if (!h) {
                  h = dlopen("/System/Library/Frameworks/IOKit.framework/IOKit", RTLD_LAZY);
                  if (h) {
                      fMatch = (MHMatchFn)dlsym(h, "IOServiceMatching");
                      fGet   = (MHGetFn)dlsym(h, "IOServiceGetMatchingService");
                      fProps = (MHPropsFn)dlsym(h, "IORegistryEntryCreateCFProperties");
                      fRel   = (MHRelFn)dlsym(h, "IOObjectRelease");
                  }
              }
              if (!fMatch || !fGet || !fProps || !fRel) return cache;
              mach_port_t s = fGet(0, fMatch("AppleSmartBattery"));
              if (!s) return cache;
              CFMutableDictionaryRef props = NULL;
              if (fProps(s, &props, kCFAllocatorDefault, 0) == KERN_SUCCESS && props) {
                  cache = (__bridge_transfer NSDictionary *)props;
                  last = now;
              }
              fRel(s);
              return cache;
          }

          static double binfo(NSString *key, double def) {
              id v = batteryInfo()[key];
              return [v isKindOfClass:NSNumber.class] ? [v doubleValue] : def;
          }

          static BOOL isCharging(void) {
              UIDevice *d = UIDevice.currentDevice;
              d.batteryMonitoringEnabled = YES;
              return d.batteryState == UIDeviceBatteryStateCharging;
          }

          #pragma mark - Network speed

          struct mh_if_data {
              uint8_t  ifi_type, ifi_typelen, ifi_physical, ifi_addrlen, ifi_hdrlen, ifi_recvquota, ifi_xmitquota, ifi_unused1;
              uint32_t ifi_mtu, ifi_metric, ifi_baudrate, ifi_ipackets, ifi_ierrors, ifi_opackets, ifi_oerrors, ifi_collisions, ifi_ibytes, ifi_obytes;
          };

          static double gDown[2], gUp[2];                 // 0 = Wi-Fi, 1 = cellular
          static uint32_t gPrevIn[2], gPrevOut[2];
          static NSTimeInterval gPrevT;
          static BOOL gHavePrev;

          static void sampleNet(void) {
              struct ifaddrs *list = NULL;
              if (getifaddrs(&list) != 0) return;
              uint32_t rxb[2] = {0, 0}, txb[2] = {0, 0};
              for (struct ifaddrs *a = list; a; a = a->ifa_next) {
                  if (!a->ifa_addr || a->ifa_addr->sa_family != AF_LINK || !a->ifa_data) continue;
                  int idx = -1;
                  if (strcmp(a->ifa_name, "en0") == 0) idx = 0;
                  else if (strncmp(a->ifa_name, "pdp_ip", 6) == 0) idx = 1;
                  if (idx < 0) continue;
                  struct mh_if_data *d = (struct mh_if_data *)a->ifa_data;
                  rxb[idx] += d->ifi_ibytes;
                  txb[idx] += d->ifi_obytes;
              }
              freeifaddrs(list);
              NSTimeInterval now = CACurrentMediaTime();
              if (gHavePrev && now - gPrevT > 0.2) {
                  for (int i = 0; i < 2; i++) {
                      gDown[i] = (double)(uint32_t)(rxb[i] - gPrevIn[i]) / (now - gPrevT);
                      gUp[i]   = (double)(uint32_t)(txb[i] - gPrevOut[i]) / (now - gPrevT);
                  }
              }
              for (int i = 0; i < 2; i++) { gPrevIn[i] = rxb[i]; gPrevOut[i] = txb[i]; }
              gPrevT = now;
              gHavePrev = YES;
          }

          static NSString *speedString(double bps, int minUnit) {
              static const char *u[] = {"B/s", "KB/s", "MB/s", "GB/s"};
              int idx = 0;
              double v = bps;
              while (idx < minUnit) { v /= 1024.0; idx++; }
              while (v >= 1024.0 && idx < 3) { v /= 1024.0; idx++; }
              return [NSString stringWithFormat:(idx == 0 ? @"%.0f %s" : @"%.1f %s"), v, u[idx]];
          }

          #pragma mark - Weather (QWeather)

          static NSDictionary *gWeather;
          static NSString *gWeatherSig;
          static NSTimeInterval gWeatherT;
          static BOOL gWeatherBusy;

          static void fetchWeather(NSString *loc) {
              NSString *key = ps(@"weatherApiKey", @"");
              if (key.length == 0 || loc.length == 0 || gWeatherBusy) return;
              NSString *sig = [NSString stringWithFormat:@"%@|%@", loc, key];
              NSTimeInterval now = CACurrentMediaTime();
              BOOL same = [sig isEqualToString:gWeatherSig];
              if (same && gWeather && now - gWeatherT < 600) return;
              if (same && !gWeather && now - gWeatherT < 30) return;
              gWeatherBusy = YES;
              gWeatherSig = sig;
              gWeatherT = now;
              NSString *q = [loc stringByAddingPercentEncodingWithAllowedCharacters:NSCharacterSet.URLQueryAllowedCharacterSet];
              NSURL *url = [NSURL URLWithString:[NSString stringWithFormat:@"https://devapi.qweather.com/v7/weather/now?location=%@&key=%@&lang=en", q, key]];
              if (!url) { gWeatherBusy = NO; return; }
              [[NSURLSession.sharedSession dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *r, NSError *e) {
                  id j = data ? [NSJSONSerialization JSONObjectWithData:data options:0 error:nil] : nil;
                  dispatch_async(dispatch_get_main_queue(), ^{
                      gWeatherBusy = NO;
                      NSDictionary *n = [j isKindOfClass:NSDictionary.class] ? j[@"now"] : nil;
                      if ([n isKindOfClass:NSDictionary.class]) gWeather = n;
                  });
              }] resume];
          }

          static NSString *weatherEmoji(NSString *code) {
              int c = code.intValue;
              if (c == 100) return @"☀️";
              if (c >= 101 && c <= 103) return @"⛅";
              if (c == 104 || (c >= 151 && c <= 153)) return @"☁️";
              if (c == 150) return @"🌙";
              if (c >= 300 && c <= 399) return @"🌧️";
              if (c >= 400 && c <= 499) return @"🌨️";
              if (c >= 500 && c <= 515) return @"🌫️";
              return @"🌡️";
          }

          static NSString *weatherText(NSString *fmt) {
              NSDictionary *w = gWeather;
              if (!w) return @"…";
              NSString *(^g)(NSString *) = ^NSString *(NSString *k) { id v = w[k]; return [v isKindOfClass:NSString.class] ? v : @""; };
              // longest tokens first so {wp} is not read as {w}
              NSArray *map = @[@[@"{wp}", g(@"windScale")], @[@"{bt}", g(@"feelsLike")], @[@"{pc}", g(@"precip")],
                               @[@"{ps}", g(@"pressure")], @[@"{i}", weatherEmoji(g(@"icon"))], @[@"{n}", g(@"text")],
                               @[@"{t}", g(@"temp")], @[@"{h}", g(@"humidity")], @[@"{w}", g(@"windDir")]];
              NSString *out = fmt;
              for (NSArray *m in map) out = [out stringByReplacingOccurrencesOfString:m[0] withString:m[1]];
              return out;
          }

          #pragma mark - Widgets

          static NSDateFormatter *formatterFor(NSString *fmt) {
              NSString *loc = ps(@"dateLocale", @"");
              NSString *key = [NSString stringWithFormat:@"%@|%@", loc, fmt];
              NSDateFormatter *f = gFmt[key];
              if (!f) {
                  f = [NSDateFormatter new];
                  f.locale = loc.length ? [NSLocale localeWithLocaleIdentifier:loc] : NSLocale.currentLocale;
                  f.dateFormat = fmt;
                  gFmt[key] = f;
              }
              return f;
          }

          static NSAttributedString *symbolStr(NSString *name, UIFont *font, UIColor *color) {
              UIImageSymbolConfiguration *cfg = [UIImageSymbolConfiguration configurationWithFont:font];
              UIImage *img = [UIImage systemImageNamed:name withConfiguration:cfg];
              if (!img) return [[NSAttributedString alloc] initWithString:@""];
              img = [img imageWithTintColor:color renderingMode:UIImageRenderingModeAlwaysOriginal];
              NSTextAttachment *a = [NSTextAttachment new];
              a.image = img;
              return [NSAttributedString attributedStringWithAttachment:a];
          }

          static NSString *defaultType(int i, int j) {
              if (j != 1) return @"none";
              return i == 1 ? @"date" : (i == 2 ? @"time" : @"battery_cap");
          }

          static NSAttributedString *widgetStr(int i, int j, UIFont *font, UIColor *color, NSDictionary *attrs) {
              NSString *type = ps(WK(i, j, @"type"), defaultType(i, j));
              NSString *s = nil;
              NSDate *now = [NSDate date];

              if ([type isEqualToString:@"date"]) {
                  s = [formatterFor(ps(WK(i, j, @"dateFormat"), @"E MMM dd")) stringFromDate:now];
              } else if ([type isEqualToString:@"time"]) {
                  s = [formatterFor(ps(WK(i, j, @"timeFormat"), @"HH:mm")) stringFromDate:now];
              } else if ([type isEqualToString:@"text"]) {
                  s = ps(WK(i, j, @"text"), @"Example");
              } else if ([type isEqualToString:@"network"]) {
                  int idx = [ps(WK(i, j, @"netType"), @"wifi") isEqualToString:@"cellular"] ? 1 : 0;
                  int icon = (int)pd(WK(i, j, @"speedIcon"), 0);
                  int minU = (int)pd(WK(i, j, @"minUnit"), 1);
                  BOOL hideZero = pb(WK(i, j, @"hideZero"), NO);
                  NSMutableArray *parts = [NSMutableArray array];
                  NSArray *dn = @[@"↓", @"▼", @""], *up = @[@"↑", @"▲", @""];
                  if (pb(WK(i, j, @"showDown"), YES) && !(hideZero && gDown[idx] < 1))
                      [parts addObject:[NSString stringWithFormat:@"%@%@%@", dn[icon % 3], icon % 3 == 2 ? @"" : @" ", speedString(gDown[idx], minU)]];
                  if (pb(WK(i, j, @"showUp"), NO) && !(hideZero && gUp[idx] < 1))
                      [parts addObject:[NSString stringWithFormat:@"%@%@%@", up[icon % 3], icon % 3 == 2 ? @"" : @" ", speedString(gUp[idx], minU)]];
                  s = [parts componentsJoinedByString:@"  "];
              } else if ([type isEqualToString:@"temp"]) {
                  double c = binfo(@"Temperature", 0) / 100.0;
                  if (c <= 0) s = @"--";
                  else if ([ps(WK(i, j, @"tempUnit"), @"c") isEqualToString:@"f"]) s = [NSString stringWithFormat:@"%.1f°F", c * 9.0 / 5.0 + 32.0];
                  else s = [NSString stringWithFormat:@"%.1f°C", c];
              } else if ([type isEqualToString:@"battery_details"]) {
                  NSString *o = ps(WK(i, j, @"battOpt"), @"watts");
                  if ([o isEqualToString:@"watts"]) {
                      double w = fabs(binfo(@"Voltage", 0) * binfo(@"InstantAmperage", binfo(@"Amperage", 0))) / 1.0e6;
                      s = [NSString stringWithFormat:@"%.1f W", w];
                  } else if ([o isEqualToString:@"current"]) {
                      double a = binfo(@"InstantAmperage", binfo(@"Amperage", 0));
                      s = [NSString stringWithFormat:@"%d mA", (int)MAX(a, 0.0)];
                  } else if ([o isEqualToString:@"amperage"]) {
                      s = [NSString stringWithFormat:@"%d mA", (int)binfo(@"Amperage", 0)];
                  } else if ([o isEqualToString:@"cycles"]) {
                      s = [NSString stringWithFormat:@"%d", (int)binfo(@"CycleCount", 0)];
                  } else {
                      s = [NSString stringWithFormat:@"%d mAh", (int)binfo(@"AppleRawCurrentCapacity", binfo(@"CurrentCapacity", 0))];
                  }
              } else if ([type isEqualToString:@"battery_cap"]) {
                  UIDevice *d = UIDevice.currentDevice;
                  d.batteryMonitoringEnabled = YES;
                  float l = d.batteryLevel;
                  int pct = l < 0 ? 0 : (int)lroundf(l * 100);
                  NSMutableAttributedString *m = [NSMutableAttributedString new];
                  if (pb(WK(i, j, @"fillSymbol"), YES)) {
                      NSString *sym = pct >= 88 ? @"battery.100" : (pct >= 63 ? @"battery.75" : (pct >= 38 ? @"battery.50" : (pct >= 13 ? @"battery.25" : @"battery.0")));
                      [m appendAttributedString:symbolStr(sym, font, color)];
                      [m appendAttributedString:[[NSAttributedString alloc] initWithString:@" " attributes:attrs]];
                  }
                  NSString *num = l < 0 ? @"--" : [NSString stringWithFormat:@"%d", pct];
                  [m appendAttributedString:[[NSAttributedString alloc] initWithString:(pb(WK(i, j, @"showPercent"), YES) ? [num stringByAppendingString:@"%"] : num) attributes:attrs]];
                  return m;
              } else if ([type isEqualToString:@"charging"]) {
                  return isCharging() ? symbolStr(@"bolt.fill", font, color) : [[NSAttributedString alloc] initWithString:@""];
              } else if ([type isEqualToString:@"weather"]) {
                  NSString *loc = ps(WK(i, j, @"weatherLoc"), @"");
                  fetchWeather(loc);
                  s = weatherText(ps(WK(i, j, @"weatherFmt"), @"{i}{n} {t}°"));
              }
              if (!s || s.length == 0) return nil;
              return [[NSAttributedString alloc] initWithString:s attributes:attrs];
          }

          #pragma mark - Style helpers

          static UIColor *parseHex(NSString *h) {
              h = [[h stringByReplacingOccurrencesOfString:@"#" withString:@""] stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceCharacterSet];
              if (h.length != 6) return nil;
              unsigned v = 0;
              if (![[NSScanner scannerWithString:h] scanHexInt:&v]) return nil;
              return [UIColor colorWithRed:((v >> 16) & 255) / 255.0 green:((v >> 8) & 255) / 255.0 blue:(v & 255) / 255.0 alpha:1];
          }

          static UIColor *colorNamed(NSString *n) {
              if ([n isEqualToString:@"black"])  return UIColor.blackColor;
              if ([n isEqualToString:@"red"])    return UIColor.systemRedColor;
              if ([n isEqualToString:@"green"])  return UIColor.systemGreenColor;
              if ([n isEqualToString:@"blue"])   return UIColor.systemBlueColor;
              if ([n isEqualToString:@"yellow"]) return UIColor.systemYellowColor;
              if ([n isEqualToString:@"orange"]) return UIColor.systemOrangeColor;
              if ([n isEqualToString:@"pink"])   return UIColor.systemPinkColor;
              return UIColor.whiteColor;
          }

          #pragma mark - Rendering

          static void renderSet(int idx) {
              int i = idx + 1;
              UIView *cont = gCont[idx];
              UILabel *lab = gLab[idx];
              BOOL land = UIDeviceOrientationIsLandscape(UIDevice.currentDevice.orientation);
              NSString *mode = ps(SK(i, @"orient"), @"both");
              BOOL show = pb(SK(i, @"enabled"), YES)
                  && !([mode isEqualToString:@"portrait"] && land) && !([mode isEqualToString:@"landscape"] && !land);
              if (!show) { cont.hidden = YES; return; }

              // text style
              CGFloat size = (CGFloat)pd(SK(i, @"fontSize"), 13.0);
              UIFont *font = nil;
              NSString *fname = ps(SK(i, @"font"), @"");
              if (fname.length) font = [UIFont fontWithName:fname size:size];
              if (!font) font = [UIFont systemFontOfSize:size];
              UIFontDescriptorSymbolicTraits tr = 0;
              if (pb(SK(i, @"bold"), YES)) tr |= UIFontDescriptorTraitBold;
              if (pb(SK(i, @"italic"), NO)) tr |= UIFontDescriptorTraitItalic;
              if (tr) { UIFontDescriptor *dsc = [font.fontDescriptor fontDescriptorWithSymbolicTraits:tr]; if (dsc) font = [UIFont fontWithDescriptor:dsc size:size]; }

              BOOL adaptive = pb(SK(i, @"adaptive"), pb(@"adaptiveColors", NO));
              UIColor *color = nil;
              if (adaptive) color = UIColor.labelColor;
              else {
                  color = parseHex(ps(SK(i, @"colorHex"), @""));
                  if (!color) color = colorNamed(ps(SK(i, @"color"), @"white"));
              }
              color = [color colorWithAlphaComponent:(CGFloat)pd(SK(i, @"textAlpha"), 1.0)];

              NSString *al = ps(SK(i, @"align"), i == 1 ? @"left" : (i == 3 ? @"right" : @"center"));
              NSMutableParagraphStyle *para = [NSMutableParagraphStyle new];
              para.alignment = [al isEqualToString:@"left"] ? NSTextAlignmentLeft : ([al isEqualToString:@"right"] ? NSTextAlignmentRight : NSTextAlignmentCenter);
              NSDictionary *attrs = @{NSFontAttributeName: font, NSForegroundColorAttributeName: color, NSParagraphStyleAttributeName: para};

              // content
              NSMutableAttributedString *all = [NSMutableAttributedString new];
              NSString *sep = pb(SK(i, @"stack"), NO) ? @"\n" : @"  ";
              for (int j = 1; j <= NSLOTS; j++) {
                  NSAttributedString *w = widgetStr(i, j, font, color, attrs);
                  if (!w || w.length == 0) continue;
                  if (all.length) [all appendAttributedString:[[NSAttributedString alloc] initWithString:sep attributes:attrs]];
                  [all appendAttributedString:w];
              }
              lab.attributedText = all;
              lab.numberOfLines = 0;

              // background blur
              BOOL blur = pb(SK(i, @"blur"), NO);
              gBlur[idx].hidden = !blur;
              if (blur) {
                  BOOL dark = [ps(SK(i, @"blurStyle"), @"dark") isEqualToString:@"dark"];
                  gBlur[idx].effect = [UIBlurEffect effectWithStyle:dark ? UIBlurEffectStyleSystemThinMaterialDark : UIBlurEffectStyleSystemThinMaterialLight];
                  gBlur[idx].layer.cornerRadius = (CGFloat)pd(SK(i, @"blurRadius"), 10.0);
                  gBlur[idx].layer.masksToBounds = YES;
                  gBlur[idx].alpha = (CGFloat)pd(SK(i, @"blurAlpha"), 1.0);
              }
              BOOL shadow = !blur && !adaptive;
              lab.layer.shadowColor = UIColor.blackColor.CGColor;
              lab.layer.shadowOpacity = shadow ? 0.55 : 0;
              lab.layer.shadowRadius = 2;
              lab.layer.shadowOffset = CGSizeZero;

              // size
              CGSize scr = UIScreen.mainScreen.bounds.size;
              CGFloat pad = blur ? 8 : 2;
              CGSize fit = [lab sizeThatFits:CGSizeMake(scr.width - 8 - 2 * pad, CGFLOAT_MAX)];
              NSString *hA = ps(SK(i, @"anchorH"), i == 1 ? @"left" : (i == 3 ? @"right" : @"center"));
              CGFloat w, h;
              if (pb(SK(i, @"autoResize"), YES)) {
                  w = MIN(ceil(fit.width) + 2 * pad, scr.width);
                  h = ceil(fit.height) + (blur ? 6 : 2);
              } else {
                  double cw = pd(SK(i, @"width"), 0), ch = pd(SK(i, @"height"), 0);
                  w = cw > 0 ? cw : [hA isEqualToString:@"center"] ? pd(@"centerWidgetSize", 200) : pd(@"sideWidgetSize", 130);
                  h = ch > 0 ? ch : ceil(fit.height) + (blur ? 6 : 2);
              }
              if (all.length == 0) { cont.hidden = YES; return; }

              // position
              CGFloat ox = (CGFloat)pd(SK(i, land ? @"lOffX" : @"pOffX"), (i == 2) ? 0 : 24);
              CGFloat oy = (CGFloat)pd(SK(i, land ? @"lOffY" : @"pOffY"), 50);
              BOOL bottom = [ps(SK(i, @"anchorV"), @"top") isEqualToString:@"bottom"];
              CGFloat x = [hA isEqualToString:@"left"] ? ox : ([hA isEqualToString:@"right"] ? scr.width - w - ox : (scr.width - w) / 2.0 + ox);
              CGFloat y = bottom ? scr.height - h - oy : oy;
              cont.frame = CGRectMake(x, y, w, h);
              gBlur[idx].frame = cont.bounds;
              lab.frame = CGRectMake(pad, 0, w - 2 * pad, h);
              cont.layer.borderWidth = pb(@"debugBorder", NO) ? 1 : 0;
              cont.layer.borderColor = UIColor.redColor.CGColor;
              cont.hidden = NO;
              gLast[idx] = CACurrentMediaTime();
          }

          static void renderAll(void) {
              for (int k = 0; k < NSETS; k++) renderSet(k);
          }

          static UILabel *gToast;
          static void toast(NSString *t) {
              if (!gWin) return;
              if (!gToast) {
                  gToast = [UILabel new];
                  gToast.font = [UIFont boldSystemFontOfSize:12];
                  gToast.textColor = UIColor.whiteColor;
                  gToast.backgroundColor = [UIColor colorWithWhite:0 alpha:0.75];
                  gToast.textAlignment = NSTextAlignmentCenter;
                  gToast.layer.cornerRadius = 8;
                  gToast.layer.masksToBounds = YES;
                  [gWin.rootViewController.view addSubview:gToast];
              }
              [gToast.layer removeAllAnimations];
              gToast.text = t;
              CGSize sz = [gToast sizeThatFits:CGSizeMake(320, 40)];
              CGFloat w = sz.width + 20;
              gToast.frame = CGRectMake((UIScreen.mainScreen.bounds.size.width - w) / 2, 105, w, 26);
              gToast.alpha = 1;
              [UIView animateWithDuration:0.4 delay:4 options:0 animations:^{ gToast.alpha = 0; } completion:nil];
          }

          static void applyPrefs(void) {
              if (!gWin) return;
              loadPrefs();
              gFmt = [NSMutableDictionary dictionary];
              gWin.hidden = !pb(@"enabled", YES);
              renderAll();
          }

          static void onReload(CFNotificationCenterRef c, void *o, CFNotificationName n, const void *obj, CFDictionaryRef u) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  applyPrefs();
                  toast([NSString stringWithFormat:@"MayHUD: settings updated (%lu)", (unsigned long)gP.count]);
              });
          }

          #pragma mark - Setup

          static void setup(void) {
              UIWindowScene *scene = nil;
              for (UIScene *s in UIApplication.sharedApplication.connectedScenes) {
                  if ([s isKindOfClass:UIWindowScene.class]) { scene = (UIWindowScene *)s; break; }
              }
              gWin = scene ? [[MHWindow alloc] initWithWindowScene:scene] : [[MHWindow alloc] initWithFrame:UIScreen.mainScreen.bounds];
              gWin.frame = UIScreen.mainScreen.bounds;
              gWin.windowLevel = 100000;
              gWin.backgroundColor = UIColor.clearColor;
              gWin.userInteractionEnabled = NO;
              UIViewController *vc = [UIViewController new];
              vc.view.backgroundColor = UIColor.clearColor;
              vc.view.userInteractionEnabled = NO;
              gWin.rootViewController = vc;
              for (int k = 0; k < NSETS; k++) {
                  gCont[k] = [UIView new];
                  gCont[k].userInteractionEnabled = NO;
                  gBlur[k] = [[UIVisualEffectView alloc] initWithEffect:nil];
                  gBlur[k].userInteractionEnabled = NO;
                  gLab[k] = [UILabel new];
                  gLab[k].userInteractionEnabled = NO;
                  [gCont[k] addSubview:gBlur[k]];
                  [gCont[k] addSubview:gLab[k]];
                  [vc.view addSubview:gCont[k]];
              }
              UIDevice.currentDevice.batteryMonitoringEnabled = YES;
              [UIDevice.currentDevice beginGeneratingDeviceOrientationNotifications];
              gWin.hidden = NO;
              applyPrefs();
              toast([NSString stringWithFormat:@"MayHUD 0.2.1 · %lu settings loaded", (unsigned long)gP.count]);

              CFNotificationCenterAddObserver(CFNotificationCenterGetDarwinNotifyCenter(), NULL, onReload,
                  CFSTR("local.mayhud.reload"), NULL, CFNotificationSuspensionBehaviorDeliverImmediately);

              gTimer = [NSTimer timerWithTimeInterval:1.0 repeats:YES block:^(NSTimer *t) {
                  gTick++;
                  if (gTick % 15 == 0) { applyPrefs(); return; }
                  if (gWin.hidden) return;
                  sampleNet();
                  NSTimeInterval now = CACurrentMediaTime();
                  for (int k = 0; k < NSETS; k++) {
                      double iv = MAX(1.0, pd(SK(k + 1, @"interval"), 1.0));
                      if (now - gLast[k] >= iv - 0.05) renderSet(k);
                  }
              }];
              [NSRunLoop.mainRunLoop addTimer:gTimer forMode:NSRunLoopCommonModes];
              NSLog(@"[MayHUD] ready (scene: %@)", scene ? @"yes" : @"no");
          }

          __attribute__((constructor))
          static void mayhud_init(void) {
              if (![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.springboard"]) return;
              NSLog(@"[MayHUD] loaded in SpringBoard");
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, 6 * NSEC_PER_SEC), dispatch_get_main_queue(), ^{ setup(); });
          }
