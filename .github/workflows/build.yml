           'Tokens: {i} icon {n} text {t} temp {h} humidity {w} wind dir {wp} wind power {bt} feels like {pc} precip {ps} pressure':'Подстановки: {i} значок {n} текст {t} темп. {h} влажность {w} направление ветра {wp} сила ветра {bt} ощущается {pc} осадки {ps} давление',
           'Date: e.g. E MMM dd. Time: e.g. HH:mm:ss':'Дата: например E MMM dd. Время: например HH:mm:ss',
           'Default sits just below the status bar. Lower Offset Y to move it onto the status bar.':'По умолчанию набор чуть ниже статус-бара. Уменьши отступ Y, чтобы поднять его на статус-бар.',
           'Color presets or a hex value (hex wins).':'Готовые цвета или hex-значение (hex главнее).',
           'Font name e.g. Menlo-Bold (empty = system)':'Имя шрифта, напр. Menlo-Bold (пусто = системный)',
           'Resets every MayHUD setting except language.':'Сбрасывает все настройки MayHUD, кроме языка.',
          }
          LANG = 'en'
          def T(s): return RU.get(s, s) if LANG == 'ru' else s
          def pn(d): d['PostNotification'] = N; return d
          def grp(label=None, foot=None):
              d = {'cell': 'PSGroupCell'}
              if label: d['label'] = T(label)
              if foot: d['footerText'] = T(foot)
              return d
          def sw(key, label, default): return pn({'cell':'PSSwitchCell','label':T(label),'default':default,'defaults':D,'key':key})
          def lst(key, label, default, opts):
              return pn({'cell':'PSLinkListCell','label':T(label),'default':default,'defaults':D,'key':key,'detail':'PSListItemsController',
                         'validTitles':[T(a) for a, b in opts],'validValues':[b for a, b in opts]})
          def edt(key, label, default='', ph=''):
              return pn({'cell':'PSEditTextCell','label':T(label),'default':default,'defaults':D,'key':key,'placeholder':ph})
          def sld(key, default, mn, mx): return pn({'cell':'PSSliderCell','default':float(default),'defaults':D,'key':key,'min':float(mn),'max':float(mx),'showValue':True})
          def lnk(label, plist): return {'cell':'PSLinkCell','label':T(label),'detail':'MHPaneController','mhplist':plist}

          TYPES = [('None','none'),('Date','date'),('Time','time'),('Text Label','text'),('Network','network'),('Device Temperature','temp'),
                   ('Battery Details','battery_details'),('Battery Capacity','battery_cap'),('Charging Symbol','charging'),('Weather','weather')]
          DEF_TYPE = {1:'date', 2:'time', 3:'battery_cap'}
