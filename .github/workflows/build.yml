      - name: Install tools
        run: brew install ldid dpkg

      - name: Compile tweak (plain clang from Xcode)
        run: |
          set -ex
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON="-isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -fmodules -Wno-deprecated-declarations -O2 -framework UIKit -framework Foundation"
          TW="$COMMON -dynamiclib -framework QuartzCore -install_name /Library/MobileSubstrate/DynamicLibraries/MayHUD.dylib"
          if xcrun --sdk iphoneos clang -arch arm64 -arch arm64e $TW Tweak.m -o MayHUD.dylib; then
            echo "built arm64 + arm64e"
          else
            echo "arm64e failed, building arm64 only"
            xcrun --sdk iphoneos clang -arch arm64 $TW Tweak.m -o MayHUD.dylib
          fi
          ldid -S MayHUD.dylib
          lipo -info MayHUD.dylib
          otool -L MayHUD.dylib

      - name: Compile settings pane (optional, falls back to a simple pane)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          PF="-isysroot $SDK -miphoneos-version-min=14.0 -fobjc-arc -Wno-deprecated-declarations -O2 -bundle -undefined dynamic_lookup -framework UIKit -framework Foundation"
          if xcrun --sdk iphoneos clang -arch arm64 -arch arm64e $PF PrefsController.m -o MayHUDPrefs \
             || xcrun --sdk iphoneos clang -arch arm64 $PF PrefsController.m -o MayHUDPrefs; then
            ldid -S MayHUDPrefs && lipo -info MayHUDPrefs && touch prefs_ok
          else
            echo "settings pane failed to compile, using the simple pane"
          fi

      - name: Build deb (iphoneos-arm64e, rootful /Library)
        run: |
          set -ex
          mkdir -p pkg/DEBIAN pkg/Library/MobileSubstrate/DynamicLibraries pkg/Library/PreferenceLoader/Preferences out
          cp MayHUD.dylib MayHUD.plist pkg/Library/MobileSubstrate/DynamicLibraries/
          chmod 755 pkg/Library/MobileSubstrate/DynamicLibraries/MayHUD.dylib
          if [ -f prefs_ok ]; then
            B=pkg/Library/PreferenceBundles/MayHUDPrefs.bundle
            mkdir -p "$B"
            cp MayHUDPrefs "$B/MayHUDPrefs"
            chmod 755 "$B/MayHUDPrefs"
            cp PrefsInfo.plist "$B/Info.plist"
            cp RootEN.plist RootRU.plist "$B/"
            cp PrefsEntry.plist pkg/Library/PreferenceLoader/Preferences/MayHUD.plist
          else
            cp PrefsFallback.plist pkg/Library/PreferenceLoader/Preferences/MayHUD.plist
          fi
          cp control pkg/DEBIAN/control
          echo "Installed-Size: $(du -sk pkg/Library | cut -f1)" >> pkg/DEBIAN/control
          dpkg-deb --root-owner-group -Zlzma -b pkg out/mayhud_iphoneos-arm64e.deb || dpkg-deb --root-owner-group -Zgzip -b pkg out/mayhud_iphoneos-arm64e.deb
          dpkg-deb -I out/mayhud_iphoneos-arm64e.deb
          dpkg-deb -c out/mayhud_iphoneos-arm64e.deb

      - uses: actions/upload-artifact@v4
        with:
          name: mayhud-deb
          path: out/*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MayHUD build ${{ github.run_number }}
          files: out/*.deb
